name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: netsuro_ci
  POSTGRES_PASSWORD: ci-only-password
  POSTGRES_DB: netsuro_ci
  ADMIN_EMAIL: ci@example.com
  ADMIN_PASSWORD: ci-only-admin-password
  APP_ENV: local

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker Compose files
        run: |
          docker compose config --quiet
          docker compose -f compose.yml -f compose.production.yml config --quiet

      - name: Build application images
        run: docker compose build api web backup

      - name: Check Python syntax and migration chain
        run: |
          docker compose run --rm --no-deps \
            -e PYTHONPYCACHEPREFIX=/tmp/python-cache \
            api python -m compileall -q app migrations
          docker compose run --rm --no-deps api alembic heads

      - name: Run automated tests
        run: docker compose run --rm --no-deps api pytest -q

      - name: Run integration smoke test
        run: |
          docker compose up -d --wait postgres redis api

          curl --fail --silent --show-error \
            http://127.0.0.1:8000/health/live

          curl --fail --silent --show-error \
            --cookie-jar /tmp/netsuro-ci-cookies \
            --header "Content-Type: application/json" \
            --data '{"email":"ci@example.com","password":"ci-only-admin-password"}' \
            http://127.0.0.1:8000/auth/login

          curl --fail --silent --show-error \
            --cookie /tmp/netsuro-ci-cookies \
            http://127.0.0.1:8000/health/ready

          docker compose exec -T redis redis-cli ping
          docker compose exec -T api alembic current

      - name: Show integration diagnostics
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200 postgres redis migrate api
