name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: netsuro_ci
  POSTGRES_PASSWORD: ci-only-password
  POSTGRES_DB: netsuro_ci
  ADMIN_EMAIL: ci@example.com
  ADMIN_PASSWORD: ci-only-admin-password
  APP_ENV: local

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Docker Compose files
        run: |
          docker compose config --quiet
          docker compose -f compose.yml -f compose.production.yml config --quiet

      - name: Build application images
        run: docker compose build api web backup

      - name: Check Python syntax and migration chain
        run: |
          docker compose run --rm --no-deps api python -m compileall -q app migrations
          docker compose run --rm --no-deps api alembic heads

      - name: Run automated tests
        run: docker compose run --rm --no-deps api pytest -q
