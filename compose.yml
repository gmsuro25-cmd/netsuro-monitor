x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-build: &api-build
  context: ./api
  target: runtime

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging

  migrate:
    build: *api-build
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    logging: *default-logging

  api:
    build: *api-build
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_ENV: ${APP_ENV:-local}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_DIR: /backups
      MONITOR_ALLOWED_PORTS: ${MONITOR_ALLOWED_PORTS:-80,443}
      MONITOR_ALLOWED_PRIVATE_HOSTS: ${MONITOR_ALLOWED_PRIVATE_HOSTS:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-5}
      RATE_LIMIT_LOGIN_PER_HOUR: ${RATE_LIMIT_LOGIN_PER_HOUR:-20}
      RATE_LIMIT_HEARTBEAT_PER_MINUTE: ${RATE_LIMIT_HEARTBEAT_PER_MINUTE:-30}
      RATE_LIMIT_HEARTBEAT_IP_PER_MINUTE: ${RATE_LIMIT_HEARTBEAT_IP_PER_MINUTE:-300}
      RATE_LIMIT_MANUAL_CHECK_PER_MINUTE: ${RATE_LIMIT_MANUAL_CHECK_PER_MINUTE:-5}
      RATE_LIMIT_WRITE_PER_MINUTE: ${RATE_LIMIT_WRITE_PER_MINUTE:-60}
      RATE_LIMIT_READ_PER_MINUTE: ${RATE_LIMIT_READ_PER_MINUTE:-300}
      RATE_LIMIT_LIVENESS_PER_MINUTE: ${RATE_LIMIT_LIVENESS_PER_MINUTE:-120}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      REQUIRE_ORIGIN: ${REQUIRE_ORIGIN:-false}
    volumes:
      - postgres_backups:/backups:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *default-logging

  scheduler:
    build: *api-build
    command: ["python", "-m", "app.scheduler"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SCHEDULER_POLL_SECONDS: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from app.queue import client; value=client.get('system:scheduler:last_seen'); raise SystemExit(0 if value and time.time()-float(value) <= 30 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    logging: *default-logging

  worker:
    build: *api-build
    command: ["python", "-m", "app.worker"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_CONSUMER_NAME: worker-1
      MONITOR_ALLOWED_PORTS: ${MONITOR_ALLOWED_PORTS:-80,443}
      MONITOR_ALLOWED_PRIVATE_HOSTS: ${MONITOR_ALLOWED_PRIVATE_HOSTS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from app.queue import client; value=client.get('system:worker:last_seen'); raise SystemExit(0 if value and time.time()-float(value) <= 30 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    logging: *default-logging

  notifier:
    build: *api-build
    command: ["python", "-m", "app.notifier"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      NOTIFIER_POLL_SECONDS: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

  maintenance:
    build: *api-build
    command: ["python", "-m", "app.maintenance"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB}
      CHECK_RETENTION_DAYS: ${CHECK_RETENTION_DAYS:-90}
      SYSTEM_RETENTION_DAYS: ${SYSTEM_RETENTION_DAYS:-90}
      MAINTENANCE_INTERVAL_SECONDS: 86400
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

  backup:
    build: ./ops
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "busybox", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  postgres_backups:
